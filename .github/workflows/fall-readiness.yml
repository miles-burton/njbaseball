name: Fall Readiness Check

on:
  schedule:
    # Weekly preseason check. During the season, the update workflows are the real monitors.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check fall production readiness
        run: |
          python3 scripts/check_sport_format.py
          python3 scripts/fall_readiness_check.py
